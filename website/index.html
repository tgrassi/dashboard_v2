<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.plot.ly/plotly-4.0.0.min.js" charset="utf-8"></script>
<script src="plotting/plotly_theme.js"></script>
<script src="plotting/plot.js"></script>

<link rel="stylesheet" href="css/style.css">
<title>Climate Dashboard</title>

<script>
    function fetchHtml(page, id) {
    fetch(page)
        .then(r => r.text())
        .then(html => document.getElementById(id).innerHTML = html);
    }
</script>

</head>

<body>

<div class="dmu-19">

    <div id="sidebar-container"></div>
    <script>fetchHtml('sidebar.html', 'sidebar-container')</script>

  <!-- Main content -->
  <main class="dmu-19__main">

    <div class="dmu-19__stage">
      <div class="dmu-19__wrap">

        <!---------- Overview --------->
        <section id="overview" class="dmu-19__section">
          <header class="dmu-19__head">
            <h1 class="dmu-19__h1">Overview</h1>

          </header>
        </section>

        <!---------- Temperature --------->
        <section id="temperature" class="dmu-19__section">
          <header class="dmu-19__head">
            <h1 class="dmu-19__h1">Temperatura</h1>

            <div id="global_temperature" style="width:800px;height:600;"></div>
            <script src="plots/global_temperature.js"></script>

            <div id="era5_daily" style="width:800px;height:600;"></div>
            <script src="plots/era5_daily.js"></script>

            <div id="era5_daily_anomaly" style="width:800px;height:600;"></div>
            <script src="plots/era5_daily_anomaly.js"></script>

          </header>
        </section>

        <!---------- City --------->
        <section id="city" class="dmu-19__section">
          <header class="dmu-19__head">
            <h1 class="dmu-19__h1">Città</h1>

            <div id="city_tmax_days" style="width:800px;height:600;"></div>
            <script src="plots/city_tmax_days.js"></script>

            <div id="city_tmin_days" style="width:800px;height:600;"></div>
            <script src="plots/city_tmin_days.js"></script>

            <div id="city_heat" style="width:800px;height:600;"></div>
            <script src="plots/city_heat.js"></script>

            <div id="city_gauss_max" style="width:800px;height:600;"></div>
            <script src="plots/city_gauss_max.js"></script>

          </header>
        </section>


        <!---------- Seas --------->
        <section id="seas" class="dmu-19__section">
          <header class="dmu-19__head">
            <h1 class="dmu-19__h1">Oceani e Mari</h1>

            <div id="med_ssta_map" style="width:800px;height:600;"></div>
            <script src="plots/med_ssta_map.js"></script>

            <div id="era5_ocean" style="width:800px;height:600;"></div>
            <script src="plots/era5_ocean.js"></script>

            <div id="era5_ocean_anomaly" style="width:800px;height:600;"></div>
            <script src="plots/era5_ocean_anomaly.js"></script>

            <div id="ocean_heat" style="width:800px;height:600;"></div>
            <script src="plots/ocean_heat.js"></script>

            <div id="enso" style="width:800px;height:600;"></div>
            <script src="plots/enso.js"></script>

            <div id="sea_level" style="width:800px;height:600;"></div>
            <script src="plots/sea_level.js"></script>

          </header>
        </section>

        <!---------- Greenhouse gases --------->
        <section id="greenhouse_gases" class="dmu-19__section">
          <header class="dmu-19__head">
            <h1 class="dmu-19__h1">Gas serra</h1>

            <div id="co2_mlo" style="width:800px;height:600;"></div>
            <script src="plots/co2_mlo.js"></script>

            <div id="ch4_gl" style="width:800px;height:600;"></div>
            <script src="plots/ch4_gl.js"></script>

            <div id="n2o_gl" style="width:800px;height:600;"></div>
            <script src="plots/n2o_gl.js"></script>

            <div id="sf6_gl" style="width:800px;height:600;"></div>
            <script src="plots/sf6_gl.js"></script>

          </header>
        </section>

        <!---------- Ice --------->
        <section id="ice" class="dmu-19__section">
          <header class="dmu-19__head">
            <h1 class="dmu-19__h1">Ghiacci</h1>

            <div id="seaice_north" style="width:800px;height:600;"></div>
            <script src="plots/seaice_north.js"></script>

            <div id="seaice_south" style="width:800px;height:600;"></div>
            <script src="plots/seaice_south.js"></script>

            <div id="glaciers_mass" style="width:800px;height:600;"></div>
            <script src="plots/glaciers_mass.js"></script>

          </header>
        </section>
      </div>
    </div>

          </header>
        </section>
      </div>
    </div>

  </main>

</div>


<script>
function showSection(id) {

  // Hide all sections
  document.querySelectorAll('.dmu-19__section').forEach(section => {
    section.style.display = 'none';
  });

  // Show selected section
  document.getElementById(id).style.display = 'block';

  // Update active button
  document.querySelectorAll('.dmu-19__navButton').forEach(button => {
    button.classList.remove('active');
  });

  event.currentTarget.classList.add('active');
}

// Show overview initially
showSection('overview');
</script>

</body>
</html>
